spring.application.name=sistema-nacional

# Puerto (Render inyectará el suyo, sino usa 8080 en local)
server.port=${PORT:8080}

# Seguridad JWT
app.security.jwt.secret=${JWT_SECRET}

# Base de datos (Render inyectará las suyas, sino usa H2 local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sistema_nacional;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sistema_dev_password}

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false