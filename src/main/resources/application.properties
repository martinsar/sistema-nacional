spring.application.name=sistema-nacional
server.port=${PORT:8080}
app.security.jwt.secret=${JWT_SECRET}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sistema_nacional}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sistema_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sistema_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
